services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_code_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # ソースコードをコンテナにマウントし、ローカルで編集したらすぐ反映されるようにする
      - ./backend:/app
    env_file:
      # Gemini APIキーなどをここから読み込む（backend/.env は各自で用意する）
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modulesはコンテナ内でインストールしたものを使う
      # （ホスト側のマウントで上書きされないようにする定番の書き方）
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data: